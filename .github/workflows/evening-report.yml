name: Evening Commute Report

on:
  schedule:
    # Runs at 4:00 PM IST (10:30 UTC) on weekdays
    - cron: "30 10 * * 1-5"
  workflow_dispatch:

jobs:
  evening-report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Generate evening report
        env:
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
        run: |
          python best_time_home.py --compact > report.txt 2>&1

      - name: Send email
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD }}
          subject: "🏠 Evening Commute — Best Time to Leave — ${{ github.event.repository.name }}"
          body: file://report.txt
          to: ${{ secrets.MAIL_TO }}
          from: Commute Bot
